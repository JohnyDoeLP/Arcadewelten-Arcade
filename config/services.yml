parameters:
    arcadewelten.arcade.tables.games: '%core.table_prefix%aw_arcade_games'
    arcadewelten.arcade.tables.cats: '%core.table_prefix%aw_arcade_cats'
    arcadewelten.arcade.tables.scores: '%core.table_prefix%aw_arcade_scores'
    arcadewelten.arcade.tables.sessions: '%core.table_prefix%aw_arcade_sessions'
    arcadewelten.arcade.tables.flagged: '%core.table_prefix%aw_arcade_flagged'
    arcadewelten.arcade.tables.ratings: '%core.table_prefix%aw_arcade_ratings'
    arcadewelten.arcade.tables.recent: '%core.table_prefix%aw_arcade_recent'
    arcadewelten.arcade.tables.cat_groups: '%core.table_prefix%aw_arcade_cat_groups'
    arcadewelten.arcade.tables.duels: '%core.table_prefix%aw_arcade_duels'

services:
    arcadewelten.arcade.games:
        class: arcadewelten\arcade\core\games
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%core.root_path%'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.cats%'

    arcadewelten.arcade.duels:
        class: arcadewelten\arcade\core\duels
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@notification_manager'
            - '%arcadewelten.arcade.tables.duels%'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.scores%'

    arcadewelten.arcade.cron.task.duels:
        class: arcadewelten\arcade\cron\task\duels
        arguments:
            - '@arcadewelten.arcade.duels'
            - '@config'
        calls:
            - [set_name, [cron.task.arcadewelten.arcade.duels]]
        tags:
            - { name: cron.task }

    arcadewelten.arcade.notification.type.duel_challenge:
        class: arcadewelten\arcade\notification\type\duel_challenge
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_helper, ['@controller.helper']]
        tags:
            - { name: notification.type }

    arcadewelten.arcade.notification.type.duel_result:
        class: arcadewelten\arcade\notification\type\duel_result
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
            - [set_helper, ['@controller.helper']]
        tags:
            - { name: notification.type }

    arcadewelten.arcade.scores:
        class: arcadewelten\arcade\core\scores
        arguments:
            - '@dbal.conn'
            - '@cache.driver'
            - '%arcadewelten.arcade.tables.scores%'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.sessions%'
            - '%arcadewelten.arcade.tables.cats%'
            - '%arcadewelten.arcade.tables.flagged%'
            - '@config'
            - '@arcadewelten.arcade.duels'

    arcadewelten.arcade.importer:
        class: arcadewelten\arcade\core\importer
        arguments:
            - '@arcadewelten.arcade.games'
            - '@config'
            - '%core.root_path%'

    arcadewelten.arcade.access:
        class: arcadewelten\arcade\core\access
        arguments:
            - '@config'
            - '@user'
            - '@auth'
            - '@request'
            - '@passwords.manager'
            - '@dbal.conn'
            - '%arcadewelten.arcade.tables.cat_groups%'

    arcadewelten.arcade.points:
        class: arcadewelten\arcade\core\points
        arguments:
            - '@config'
            - '@language'
            - '@?dmzx.ultimatepoints.api'

    arcadewelten.arcade.ratings:
        class: arcadewelten\arcade\core\ratings
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%arcadewelten.arcade.tables.ratings%'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.scores%'
            - '%arcadewelten.arcade.tables.sessions%'
            - '%arcadewelten.arcade.tables.recent%'

    arcadewelten.arcade.recent:
        class: arcadewelten\arcade\core\recent
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%arcadewelten.arcade.tables.recent%'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.cats%'

    arcadewelten.arcade.privacy:
        class: arcadewelten\arcade\core\privacy
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@language'
            - '@arcadewelten.arcade.points'
            - '@arcadewelten.arcade.ratings'
            - '@arcadewelten.arcade.recent'
            - '@arcadewelten.arcade.duels'
            - '@arcadewelten.arcade.forum'
            - '%arcadewelten.arcade.tables.games%'
            - '%arcadewelten.arcade.tables.cats%'

    arcadewelten.arcade.forum:
        class: arcadewelten\arcade\core\forum
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@user'
            - '@auth'
            - '@language.loader'
            - '@arcadewelten.arcade.games'
            - '@arcadewelten.arcade.points'
            - '%core.root_path%'
            - '%core.php_ext%'

    arcadewelten.arcade.season:
        class: arcadewelten\arcade\core\season
        arguments:
            - '@arcadewelten.arcade.games'
            - '@arcadewelten.arcade.scores'
            - '@arcadewelten.arcade.points'
            - '@config'
            - '@log'
            - '@user'
            - '@language'
            - '@arcadewelten.arcade.forum'

    arcadewelten.arcade.legacy:
        class: arcadewelten\arcade\core\legacy
        arguments:
            - '@arcadewelten.arcade.games'
            - '@arcadewelten.arcade.scores'
            - '@arcadewelten.arcade.points'
            - '@request'
            - '@user'
            - '@auth'
            - '@controller.helper'
            - '@config'
            - '@log'

    arcadewelten.arcade.controller.main:
        class: arcadewelten\arcade\controller\main
        arguments:
            - '@arcadewelten.arcade.games'
            - '@arcadewelten.arcade.scores'
            - '@arcadewelten.arcade.access'
            - '@arcadewelten.arcade.points'
            - '@arcadewelten.arcade.ratings'
            - '@arcadewelten.arcade.recent'
            - '@arcadewelten.arcade.duels'
            - '@arcadewelten.arcade.forum'
            - '@config'
            - '@controller.helper'
            - '@template'
            - '@language'
            - '@user'
            - '@request'
            - '@pagination'
            - '%core.root_path%'

    arcadewelten.arcade.listener:
        class: arcadewelten\arcade\event\listener
        arguments:
            - '@arcadewelten.arcade.legacy'
            - '@arcadewelten.arcade.scores'
            - '@arcadewelten.arcade.ratings'
            - '@arcadewelten.arcade.recent'
            - '@arcadewelten.arcade.access'
            - '@arcadewelten.arcade.duels'
            - '@controller.helper'
            - '@template'
            - '@request'
            - '@user'
            - '@language'
            - '@config'
        tags:
            - { name: event.listener }

    arcadewelten.arcade.privacy_listener:
        class: arcadewelten\arcade\event\privacy_listener
        arguments:
            - '@arcadewelten.arcade.privacy'
            - '@template'
            - '@request'
            - '@user'
        tags:
            - { name: event.listener }
