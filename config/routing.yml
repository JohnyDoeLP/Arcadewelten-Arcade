arcadewelten_arcade_index:
    path: /arcadehall
    defaults: { _controller: arcadewelten.arcade.controller.main:index, cat_id: 0 }

arcadewelten_arcade_cat:
    path: /arcadehall/cat/{cat_id}
    defaults: { _controller: arcadewelten.arcade.controller.main:index }
    requirements:
        cat_id: \d+

