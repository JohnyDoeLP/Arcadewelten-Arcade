name: Release

# Builds the installable ZIP and publishes a GitHub release
# whenever a version tag (e.g. v0.11.0-beta) is pushed.
# Alternatively: Actions -> Release -> "Run workflow" with the tag name;
# the tag is then created on the selected branch together with the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create, e.g. v0.11.0-beta'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag name
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Tag must look like v0.11.0-beta, got: $TAG"; exit 1 ;;
          esac

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check version numbers (composer.json, version.json)
        run: |
          VERSION="${TAG#v}"
          C=$(python3 -c "import json;print(json.load(open('composer.json'))['version'])")
          V=$(python3 -c "import json;d=json.load(open('version.json'));print(' '.join(b['current'] for s in d.values() if isinstance(s,dict) for b in s.values()))")
          echo "tag: $VERSION, composer.json: $C, version.json: $V"
          [ "$C" = "$VERSION" ] || { echo "composer.json has version $C, expected $VERSION"; exit 1; }
          echo " $V " | grep -q " $VERSION " || { echo "version.json does not list $VERSION (needed for the ACP update check)"; exit 1; }

      - name: Build installable ZIP (arcadewelten/arcade/...)
        run: |
          VERSION="${TAG#v}"
          mkdir -p build/arcadewelten/arcade
          git archive HEAD | tar -x -C build/arcadewelten/arcade
          rm -rf build/arcadewelten/arcade/.github build/arcadewelten/arcade/.gitignore
          cd build
          zip -qr "../arcadewelten_arcade_${VERSION}.zip" arcadewelten
          cd ..
          ls -l "arcadewelten_arcade_${VERSION}.zip"

      - name: Write release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Requirements:** phpBB 3.3, PHP 8.2 or newer."
            echo ""
            echo "**Installation:** download \`arcadewelten_arcade_${VERSION}.zip\` below, upload the folder \`arcadewelten\` into \`ext/\` and enable the extension in the ACP. When updating: disable the extension (do not delete its data), replace the folder, enable it again and purge the cache. Step-by-step guide: INSTALL.en.md / INSTALL.de.md."
            echo ""
            echo "Please use \`arcadewelten_arcade_${VERSION}.zip\` – not \"Source code\", which lacks the required folder structure."
            echo ""
            echo "Free HTML5 starter pack: https://arcadewelten.eu/phpBB2/dlext/details?df_id=17"
          } >> notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          PRE=""
          case "$TAG" in
            *alpha*|*beta*|*rc*) PRE="--prerelease" ;;
          esac
          gh release create "$TAG" "arcadewelten_arcade_${VERSION}.zip" \
            --title "Arcadewelten Arcade ${VERSION}" \
            --notes-file notes.md --target "$GITHUB_SHA" $PRE
